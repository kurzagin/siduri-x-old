services:
  postgres:
    image: postgres:16
    profiles: [optional]
    environment:
      POSTGRES_USER: siduri
      POSTGRES_PASSWORD: siduri
      POSTGRES_DB: siduri
    ports: ["5432:5432"]
    volumes: ["siduri-postgres:/var/lib/postgresql/data"]
  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    profiles: [optional]
    ports: ["50021:50021"]
volumes:
  siduri-postgres:
