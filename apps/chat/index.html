<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siduri / Private Channel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <nav class="site-nav" aria-label="Siduri navigation">
    <a class="brand" href="../chat/index.html">SIDURI</a>
    <div class="nav-links"><a class="active" href="../chat/index.html" aria-current="page">Chat</a><a href="../operator_console/index.html">Console</a></div>
  </nav>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">SIDURI / PRIVATE CHANNEL</p>
        <h1>Stay a while, Master.</h1>
        <p class="dek">A quiet room for conversation, memory, and whatever the evidence can support.</p>
      </div>
      <div class="presence"><span class="presence-dot"></span><span id="status">connecting</span></div>
    </header>

    <section class="bezel chat-bezel" aria-label="Private chat">
      <div class="chat-core">
        <div id="messages" class="messages" aria-live="polite">
          <article class="message siduri-message intro-message"><div class="message-mark">S</div><div><p class="message-label">SIDURI <span>now</span></p><p>私はここにいます。今日は、何を記録しましょうか。</p><p class="translation">I’m here. What shall we record today?</p></div></article>
        </div>
        <form id="composer" class="composer">
          <label class="sr-only" for="message">Message Siduri</label>
          <textarea id="message" rows="1" maxlength="4000" placeholder="Write to Siduri…" autocomplete="off"></textarea>
          <button id="send" type="submit" aria-label="Send message"><span>Send</span><b>↗</b></button>
        </form>
      </div>
    </section>

    <footer class="footer"><span>Private local session</span><span id="evidence">No observation evidence attached</span></footer>
  </main>
  <script type="module" src="chat.js"></script>
</body>
</html>
